<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolltore</title>
<style>
  :root { --bg:#111418; --karte:#1b2027; --text:#e8ecf1; --leise:#8b95a3; --rand:#2b323c;
          --gruen:#34c759; --rot:#ff453a; --gelb:#ffcc00; --blau:#0a84ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-user-select:none; user-select:none; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .leise { color:var(--leise); font-size:14px; }
  .karte { background:var(--karte); border:1px solid var(--rand); border-radius:14px; padding:14px; margin-top:14px; }
  .kopf { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .kopf h2 { font-size:18px; margin:0; }
  .zustand { font-weight:600; }
  .zustand.warn { color:var(--gelb); }
  .balken { height:14px; background:#000; border:1px solid var(--rand); border-radius:7px; overflow:hidden; margin:12px 0 4px; }
  .balken > div { height:100%; width:0; background:var(--blau); transition:width .3s; }
  .knoepfe { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  button { font:inherit; font-weight:600; color:var(--text); background:#232a33; border:1px solid var(--rand);
           border-radius:12px; padding:14px 8px; min-height:52px; cursor:pointer; touch-action:manipulation; }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .auf { background:#123d1f; border-color:#1f6b35; }
  .zu { background:#14304d; border-color:#1f4f80; }
  .stopp { background:#4a1210; border-color:#8a221d; }
  details { margin-top:12px; border-top:1px solid var(--rand); padding-top:10px; }
  summary { cursor:pointer; color:var(--leise); font-weight:600; }
  .tippen { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .tippen button { min-height:64px; font-size:18px; }
  .tippen button.aktiv { background:var(--blau); border-color:var(--blau); }
  .reihe { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .reihe button { font-weight:500; font-size:15px; min-height:46px; }
  .hinweis { font-size:13px; color:var(--leise); margin:8px 0 0; }
  .meldung { min-height:20px; margin-top:12px; color:#ff8a80; font-size:14px; }
  code { background:#000; padding:2px 6px; border-radius:6px; font-size:13px; }
  ul { padding-left:18px; margin:6px 0; }
</style></head><body><main>
  <h1>Rolltore</h1>
  <div class="leise" id="netz">Verbinde …</div>
  <div id="tore"></div>
  <div class="meldung" id="meldung"></div>
  <div class="karte leise">
    <b style="color:var(--text)">Siri</b> – in der Kurzbefehle-App je Befehl „Inhalte von URL abrufen“ mit:
    <ul id="siri"></ul>
  </div>
</main>
<template id="vorlage">
  <div class="karte tor">
    <div class="kopf"><h2 class="name"></h2><span class="zustand"></span></div>
    <div class="balken"><div></div></div>
    <div class="leise prozent"></div>
    <div class="knoepfe">
      <button class="auf" data-a="auf">▲ Auf</button>
      <button class="stopp" data-a="stopp">■ Stopp</button>
      <button class="zu" data-a="zu">▼ Zu</button>
    </div>
    <details>
      <summary>Kalibrieren</summary>
      <p class="hinweis">Knopf <b>halten</b> = Tor fährt, loslassen = steht. Erst auf die
        geschlossene Stellung fahren und „Zu speichern“, dann auf die offene und „Auf speichern“.</p>
      <div class="tippen">
        <button data-t="1">▲ halten</button>
        <button data-t="-1">▼ halten</button>
      </div>
      <div class="reihe">
        <button data-f="1">▲ fein</button>
        <button data-f="-1">▼ fein</button>
        <button data-k="zu_speichern">Zu speichern</button>
        <button data-k="auf_speichern">Auf speichern</button>
      </div>
      <p class="hinweis">Nach einem Stromausfall während der Fahrt: Tor von Hand oder per
        Tippen auf eine Endlage bringen und bestätigen.</p>
      <div class="reihe">
        <button data-k="hier_zu">Tor steht auf Zu</button>
        <button data-k="hier_auf">Tor steht auf Auf</button>
        <button data-k="umkehren">Richtung umkehren</button>
        <button data-k="vergessen">Endlagen löschen</button>
      </div>
      <p class="hinweis pos"></p>
    </details>
  </div>
</template>
<script>
let pin = ''; try { pin = localStorage.getItem('rolltor-pin') || ''; } catch (e) {}
const karten = {};
const meldung = (t) => { document.getElementById('meldung').textContent = t || ''; };
async function ruf(pfad, daten) {
  const r = await fetch(pfad, { method: daten ? 'POST' : 'GET', headers: { 'X-Pin': pin },
                                body: daten ? JSON.stringify(daten) : undefined, cache: 'no-store' });
  if (r.status === 401) { pin = prompt('PIN der Rolltor-Steuerung') || '';
    try { localStorage.setItem('rolltor-pin', pin); } catch (e) {} throw new Error('PIN nötig'); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function karte(t) {
  if (karten[t.nr]) return karten[t.nr];
  const k = document.getElementById('vorlage').content.firstElementChild.cloneNode(true);
  k.querySelector('.name').textContent = t.name;
  k.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () =>
    senden('/befehl', { tor: t.nr, aktion: b.dataset.a })));
  k.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () =>
    senden('/fein', { tor: t.nr, r: Number(b.dataset.f) })));
  k.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => {
    if ((b.dataset.k === 'umkehren' || b.dataset.k === 'vergessen')
        && !confirm('Die gespeicherten Endlagen von ' + t.name + ' werden gelöscht. Weiter?')) return;
    senden('/kalibrieren', { tor: t.nr, was: b.dataset.k });
  }));
  // Halten = fahren: solange gedrueckt alle 250 ms "weiter" (der Pico stoppt selbst nach 0,7 s
  // ohne Nachricht), beim Loslassen sofort "halt". Alle Nachrichten laufen NACHEINANDER
  // (kette) - sonst koennte ein noch unterwegs befindliches "weiter" das "halt" ueberholen.
  let kette = Promise.resolve();
  const tipp = (r) => { kette = kette.then(() => ruf('/tippen', { tor: t.nr, r }).then(zeigen))
                                     .catch((x) => meldung(x.message)); };
  k.querySelectorAll('[data-t]').forEach((b) => {
    let iv = null;
    const los = (e) => { e.preventDefault(); if (iv) return; b.classList.add('aktiv');
      const r = Number(b.dataset.t); tipp(r); iv = setInterval(() => tipp(r), 250); };
    const halt = () => { if (!iv) return; clearInterval(iv); iv = null; b.classList.remove('aktiv'); tipp(0); };
    b.addEventListener('pointerdown', los);
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach((ev) => b.addEventListener(ev, halt));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('visibilitychange', halt);
  });
  document.getElementById('tore').appendChild(k);
  karten[t.nr] = k;
  return k;
}
function zeigen(s) {
  document.getElementById('netz').textContent = s.wlan === 'heim'
    ? 'Heim-WLAN · http://' + s.host + '.local' : 'Eigenes WLAN des Pico (Siri nur im Heim-WLAN)';
  s.tore.forEach((t) => {
    const k = karte(t);
    const z = k.querySelector('.zustand');
    z.textContent = t.text;
    z.classList.toggle('warn', t.unsicher || !t.kalibriert);
    k.querySelector('.balken > div').style.width = (t.prozent === null ? 0 : t.prozent) + '%';
    k.querySelector('.prozent').textContent = t.prozent === null ? '' : t.prozent + ' % offen';
    const sperre = !t.kalibriert || t.unsicher;
    k.querySelectorAll('[data-a="auf"], [data-a="zu"]').forEach((b) => { b.disabled = sperre; });
    k.querySelector('.pos').textContent = 'Position ' + t.pos + ' · Zu ' + (t.zu === null ? '–' : t.zu)
      + ' · Auf ' + (t.auf === null ? '–' : t.auf) + (t.umkehren ? ' · Richtung umgekehrt' : '');
    if (sperre && !k.dataset.offen) { k.querySelector('details').open = true; k.dataset.offen = '1'; }
  });
  const basis = 'http://' + (s.wlan === 'heim' ? s.host + '.local' : location.host);
  document.getElementById('siri').innerHTML = s.tore.map((t) =>
    '<li>' + t.name + ': <code>' + basis + '/tor/' + t.nr + '/auf</code> · <code>…/zu</code></li>').join('')
    + '<li>Beide: <code>' + basis + '/tor/alle/zu</code></li>';
}
async function senden(pfad, daten) {
  try { zeigen(await ruf(pfad, daten)); meldung(''); } catch (e) { meldung(e.message); }
}
async function holen() {
  try { zeigen(await ruf('/status'));
        if (/^Keine Verbindung/.test(document.getElementById('meldung').textContent)) meldung(''); } catch (e) { meldung('Keine Verbindung zur Steuerung (' + e.message + ')'); }
}
holen(); setInterval(holen, 500);
</script></body></html>
